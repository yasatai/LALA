name: Deploy preview to GitHub Pages

# 注意: これは「デザイン確認用プレビュー」を https://yasatai.github.io/LALA/ に公開するためのワークフロー。
# 本番は base '/' でレンタルサーバー（PHP/Apache）に配置する運用のため、
# ここでは base '/LALA/' でビルドし、Pages 用の SPA フォールバック 404.html を用意する。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build (base=/LALA/)
        run: npm run build
        env:
          VITE_BASE: /LALA/

      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
