<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LALA</title>
  <script>
    const segment = location.pathname.split('/')[1];
    const pathname = location.pathname;

    // GitHub Pages SPA routing: redirect all 404s to index.html with path info
    const isGithubPages = pathname.includes('/LALA/');
    const redirectPath = isGithubPages ? '/LALA/index.html?p=' + encodeURIComponent(pathname) : '/index.html?p=' + encodeURIComponent(pathname);

    location.replace(redirectPath);
  </script>
</head>
<body>
</body>
</html>
